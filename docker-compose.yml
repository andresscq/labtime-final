services:

  # ---------- Bases de datos (una por microservicio, sin excepciones) ----------
  users-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${USERS_DB_USER:-users_user}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-users_pass}
      POSTGRES_DB: usersdb
    volumes:
      - users_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_DB_USER:-users_user} -d usersdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  labtime-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${LABTIME_DB_USER:-labtime_user}
      POSTGRES_PASSWORD: ${LABTIME_DB_PASSWORD:-labtime_pass}
      POSTGRES_DB: labtimedb
    volumes:
      - labtime_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LABTIME_DB_USER:-labtime_user} -d labtimedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Microservicios ----------
  users:
    build: ./users
    environment:
      USERS_DB_USER: ${USERS_DB_USER:-users_user}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:-users_pass}
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      SERVER_FORWARD_HEADERS_STRATEGY: FRAMEWORK
    expose:
      - "8080"
    depends_on:
      users-db:
        condition: service_healthy

  labtime:
    build: ./labtime
    environment:
      LABTIME_DB_USER: ${LABTIME_DB_USER:-labtime_user}
      LABTIME_DB_PASSWORD: ${LABTIME_DB_PASSWORD:-labtime_pass}
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      SERVER_FORWARD_HEADERS_STRATEGY: FRAMEWORK
    expose:
      - "8081"
    depends_on:
      labtime-db:
        condition: service_healthy
      # Dependencia entre microservicios: solo "arranco", no "estoy sano".
      # Si users tarda, labtime igual arranca (no hay llamadas sincronas
      # entre ambos hoy, pero se deja documentado para cuando las haya).
      users:
        condition: service_started

  # ---------- Unico punto de entrada expuesto ----------
  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "9090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - users
      - labtime

  # ---------- Explorador de base de datos (Criterio 3) ----------
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@labtime.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "5050:80"
    depends_on:
      - users-db
      - labtime-db

volumes:
  users_data:
  labtime_data:
  pgadmin_data:
