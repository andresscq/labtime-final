events{}

http {
    resolver 127.0.0.11 valid=10s;

    # CORS: la app movil en desarrollo corre en localhost:5173 (Vite) y le
    # habla a este gateway en localhost:9090 -- son origenes distintos, asi
    # que el navegador exige estos headers o bloquea la respuesta.
    map $http_origin $cors_origin {
        default "";
        "~^http://localhost:5173$" $http_origin;
        "~^capacitor://localhost$" $http_origin;
    }

    # Upstreams: un nombre logico por microservicio, resuelto por Docker DNS
    # al nombre de servicio de docker-compose (nunca localhost, nunca IP fija).
    upstream users_upstream {
        server users:8080;
    }

    upstream labtime_upstream {
        server labtime:8081;
    }

    server {
        listen 80;

        # Timeouts explicitos: si un microservicio no responde, nginx corta
        # en vez de dejar la conexion colgada indefinidamente.
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # ---------- users ----------
        location /users {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://users_upstream;
            # Propaga el token de Cognito tal cual llego del cliente.
            proxy_set_header Authorization $http_authorization;
            include /etc/nginx/proxy_headers.conf;
        }

        # ---------- labtime (rooms + slots + bookings + equipment-requests) ----------
        location /rooms {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://labtime_upstream;
            proxy_set_header Authorization $http_authorization;
            include /etc/nginx/proxy_headers.conf;
        }

        location /slots {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://labtime_upstream;
            proxy_set_header Authorization $http_authorization;
            include /etc/nginx/proxy_headers.conf;
        }

        location /bookings {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://labtime_upstream;
            proxy_set_header Authorization $http_authorization;
            include /etc/nginx/proxy_headers.conf;
        }

        location /equipment-requests {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://labtime_upstream;
            proxy_set_header Authorization $http_authorization;
            include /etc/nginx/proxy_headers.conf;
        }

        location = / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}
