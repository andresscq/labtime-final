spring:
  application:
    name: users

  datasource:
    url: jdbc:postgresql://users-db:5432/usersdb
    driver-class-name: org.postgresql.Driver
    username: ${USERS_DB_USER:users_user}
    password: ${USERS_DB_PASSWORD:users_pass}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.${COGNITO_REGION:us-east-1}.amazonaws.com/${COGNITO_USER_POOL_ID:us-east-1_4B0CaMgZv}

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
